name: Publish Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/publish-helm-chart.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: |
          helm dependency build charts/heimdall-aiops-stack
          cat > /tmp/values.yaml <<'YAML'
          secrets:
            alertWebhookToken: redacted-alert-token
            readGatewayToken: redacted-read-token
            awsAccessKeyId: redacted-access-key
            awsSecretAccessKey: redacted-secret-key
          YAML
          helm lint charts/heimdall-aiops-stack -f /tmp/values.yaml

      - name: Package chart
        run: |
          mkdir -p .chart-release
          helm dependency build charts/heimdall-aiops-stack
          helm package charts/heimdall-aiops-stack --destination .chart-release
          helm repo index .chart-release --url https://s-heimdall.github.io/heimdall_aiops_stack

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .chart-release
