{{- if and .Values.langfuse.enabled .Values.langfuse.bootstrap.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.langfuse.bootstrap.secretName }}
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
    app.kubernetes.io/name: heimdall-langfuse-bootstrap
type: Opaque
stringData:
  LANGFUSE_SALT: {{ required "langfuse.bootstrap.salt is required when langfuse.enabled=true" .Values.langfuse.bootstrap.salt | quote }}
  ENCRYPTION_KEY: {{ required "langfuse.bootstrap.encryptionKey is required when langfuse.enabled=true" .Values.langfuse.bootstrap.encryptionKey | quote }}
  NEXTAUTH_SECRET: {{ required "langfuse.bootstrap.nextauthSecret is required when langfuse.enabled=true" .Values.langfuse.bootstrap.nextauthSecret | quote }}
  POSTGRES_PASSWORD: {{ required "langfuse.bootstrap.postgresPassword is required when langfuse.enabled=true" .Values.langfuse.bootstrap.postgresPassword | quote }}
  REDIS_PASSWORD: {{ required "langfuse.bootstrap.redisPassword is required when langfuse.enabled=true" .Values.langfuse.bootstrap.redisPassword | quote }}
  CLICKHOUSE_PASSWORD: {{ required "langfuse.bootstrap.clickhousePassword is required when langfuse.enabled=true" .Values.langfuse.bootstrap.clickhousePassword | quote }}
  MINIO_ROOT_USER: {{ required "langfuse.bootstrap.minioRootUser is required when langfuse.enabled=true" .Values.langfuse.bootstrap.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ required "langfuse.bootstrap.minioRootPassword is required when langfuse.enabled=true" .Values.langfuse.bootstrap.minioRootPassword | quote }}
  LANGFUSE_INIT_ORG_ID: {{ .Values.langfuse.bootstrap.orgId | quote }}
  LANGFUSE_INIT_ORG_NAME: {{ .Values.langfuse.bootstrap.orgName | quote }}
  LANGFUSE_INIT_PROJECT_ID: {{ .Values.langfuse.bootstrap.projectId | quote }}
  LANGFUSE_INIT_PROJECT_NAME: {{ .Values.langfuse.bootstrap.projectName | quote }}
  LANGFUSE_INIT_PROJECT_RETENTION: {{ .Values.langfuse.bootstrap.projectRetentionDays | quote }}
  LANGFUSE_INIT_PROJECT_PUBLIC_KEY: {{ required "langfuse.bootstrap.publicKey is required when langfuse.enabled=true" .Values.langfuse.bootstrap.publicKey | quote }}
  LANGFUSE_INIT_PROJECT_SECRET_KEY: {{ required "langfuse.bootstrap.secretKey is required when langfuse.enabled=true" .Values.langfuse.bootstrap.secretKey | quote }}
  LANGFUSE_INIT_USER_EMAIL: {{ required "langfuse.bootstrap.adminEmail is required when langfuse.enabled=true" .Values.langfuse.bootstrap.adminEmail | quote }}
  LANGFUSE_INIT_USER_NAME: {{ .Values.langfuse.bootstrap.adminName | quote }}
  LANGFUSE_INIT_USER_PASSWORD: {{ required "langfuse.bootstrap.adminPassword is required when langfuse.enabled=true" .Values.langfuse.bootstrap.adminPassword | quote }}
{{- end }}
