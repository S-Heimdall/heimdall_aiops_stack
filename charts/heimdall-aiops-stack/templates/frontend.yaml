{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heimdall-frontend
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    app.kubernetes.io/name: heimdall-frontend
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: heimdall-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heimdall-frontend
    spec:
      {{- include "heimdall-aiops-stack.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "heimdall-aiops-stack.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.frontend.image.repository "tag" .Values.frontend.image.tag) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: heimdall-frontend
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    app.kubernetes.io/name: heimdall-frontend
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app.kubernetes.io/name: heimdall-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
{{- end }}
