{{- if .Values.resourceCollector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heimdall-resource-collector
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    app.kubernetes.io/name: heimdall-resource-collector
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.resourceCollector.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: heimdall-resource-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heimdall-resource-collector
    spec:
      {{- include "heimdall-aiops-stack.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: collector
          image: {{ include "heimdall-aiops-stack.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.resourceCollector.image.repository "tag" .Values.resourceCollector.image.tag) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              value: {{ .Values.global.databaseUrl | quote }}
            - name: REDIS_URL
              value: {{ .Values.global.redisUrl | quote }}
            - name: RELAY_ENABLED
              value: {{ .Values.resourceCollector.relayEnabled | quote }}
            - name: WORKER_ENABLED
              value: {{ .Values.resourceCollector.workerEnabled | quote }}
            - name: AWS_REGION
              value: {{ .Values.global.awsRegion | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: heimdall-collector-aws-runtime
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: heimdall-collector-aws-runtime
                  key: AWS_SECRET_ACCESS_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: heimdall-resource-collector
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    app.kubernetes.io/name: heimdall-resource-collector
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: heimdall-resource-collector
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
