{{- if .Values.alertIngest.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heimdall-alert-ingest
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    app.kubernetes.io/name: heimdall-alert-ingest
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.alertIngest.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: heimdall-alert-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heimdall-alert-ingest
    spec:
      {{- include "heimdall-aiops-stack.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: alert-ingest
          image: {{ include "heimdall-aiops-stack.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.alertIngest.image.repository "tag" .Values.alertIngest.image.tag) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              value: {{ .Values.global.databaseUrl | quote }}
            - name: REDIS_URL
              value: {{ .Values.global.redisUrl | quote }}
            - name: ALERT_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alert-webhook-token
                  key: token
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: heimdall-alert-ingest
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    app.kubernetes.io/name: heimdall-alert-ingest
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: heimdall-alert-ingest
  ports:
    - name: http
      port: {{ .Values.alertIngest.service.port }}
      targetPort: http
{{- if .Values.alertIngest.privateLinkNlb.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: heimdall-alert-ingest-nlb
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    app.kubernetes.io/name: heimdall-alert-ingest
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.alertIngest.privateLinkNlb.annotations | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: heimdall-alert-ingest
  ports:
    - name: http
      port: {{ .Values.alertIngest.service.port }}
      targetPort: http
{{- end }}
{{- end }}
