{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: heimdall-postgres
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    app.kubernetes.io/name: heimdall-postgres
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: heimdall-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: heimdall-postgres
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    app.kubernetes.io/name: heimdall-postgres
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
spec:
  serviceName: heimdall-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: heimdall-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heimdall-postgres
    spec:
      containers:
        - name: postgres
          image: {{ printf "%s/%s:%s" .Values.postgresql.image.registry .Values.postgresql.image.repository .Values.postgresql.image.tag | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.password | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgresql.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storageSize | quote }}
{{- end }}
