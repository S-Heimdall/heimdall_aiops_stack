{{- if .Values.harborRegistrySecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.harborRegistrySecret.name }}
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ dict "auths" (dict .Values.harborRegistrySecret.server (dict "username" .Values.harborRegistrySecret.username "password" .Values.harborRegistrySecret.password "email" .Values.harborRegistrySecret.email "auth" (printf "%s:%s" .Values.harborRegistrySecret.username .Values.harborRegistrySecret.password | b64enc))) | toJson | quote }}
---
{{- end }}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: alert-webhook-token
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "secrets.alertWebhookToken is required" .Values.secrets.alertWebhookToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: heimdall-read-gateway-token
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "secrets.readGatewayToken is required" .Values.secrets.readGatewayToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: heimdall-collector-aws-runtime
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ required "secrets.awsAccessKeyId is required" .Values.secrets.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "secrets.awsSecretAccessKey is required" .Values.secrets.awsSecretAccessKey | quote }}
{{- if .Values.telemetryQueryGateway.inboundToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: heimdall-tqg-inbound-token
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.telemetryQueryGateway.inboundToken | quote }}
{{- end }}
{{- end }}
{{- if and .Values.operationService.enabled .Values.secrets.operation.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: heimdall-operation-mcp-secrets
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
    app.kubernetes.io/name: heimdall-operation-mcp
type: Opaque
stringData:
{{- if .Values.secrets.operation.data }}
{{- toYaml .Values.secrets.operation.data | nindent 2 }}
{{- else }}
  OPERATION_POSTGRES_DSN: {{ .Values.global.databaseUrl | quote }}
{{- end }}
{{- end }}
