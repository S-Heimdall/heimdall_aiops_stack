{{- if .Values.operationService.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: heimdall-operation-mcp
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    app.kubernetes.io/name: heimdall-operation-mcp
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: heimdall-operation-mcp-deployment-operator
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    app.kubernetes.io/name: heimdall-operation-mcp
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: heimdall-operation-mcp-deployment-operator
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    app.kubernetes.io/name: heimdall-operation-mcp
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: heimdall-operation-mcp
    namespace: {{ include "heimdall-aiops-stack.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: heimdall-operation-mcp-deployment-operator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: heimdall-operation-mcp-config
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    app.kubernetes.io/name: heimdall-operation-mcp
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.operationService.config | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heimdall-operation-mcp
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    app.kubernetes.io/name: heimdall-operation-mcp
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operationService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: heimdall-operation-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heimdall-operation-mcp
    spec:
      serviceAccountName: heimdall-operation-mcp
      {{- include "heimdall-aiops-stack.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: heimdall-operation-mcp
          image: {{ include "heimdall-aiops-stack.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.operationService.image.repository "tag" .Values.operationService.image.tag) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["heimdall-operation-mcp"]
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: heimdall-operation-mcp-config
            - secretRef:
                name: heimdall-operation-mcp-secrets
                optional: true
          ports:
            - name: mcp
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: heimdall-operation-mcp
  namespace: {{ include "heimdall-aiops-stack.namespace" . }}
  labels:
    app.kubernetes.io/name: heimdall-operation-mcp
    {{- include "heimdall-aiops-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: heimdall-operation-mcp
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
{{- end }}
