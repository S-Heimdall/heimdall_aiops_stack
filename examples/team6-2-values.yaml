global:
  awsRegion: ap-northeast-2

secrets:
  alertWebhookToken: REPLACE_ME_ALERTMANAGER_WEBHOOK_TOKEN
  readGatewayToken: REPLACE_ME_SERVICE_SINGLE_GATEWAY_TOKEN
  awsAccessKeyId: REPLACE_ME_AWS_ACCESS_KEY_ID
  awsSecretAccessKey: REPLACE_ME_AWS_SECRET_ACCESS_KEY

harborRegistrySecret:
  create: true
  username: REPLACE_ME_HARBOR_USERNAME
  password: REPLACE_ME_HARBOR_PASSWORD
  email: REPLACE_ME_EMAIL

backend:
  env:
    AIOPS_ALERT_INGEST_URL: http://heimdall-alert-ingest-nlb.heimdall.svc.cluster.local:8000

telemetryQueryGateway:
  connectionsJson: "[]"

langfuse:
  enabled: false
  bootstrap:
    publicKey: REPLACE_ME_LANGFUSE_PUBLIC_KEY
    secretKey: REPLACE_ME_LANGFUSE_SECRET_KEY
    adminEmail: REPLACE_ME_LANGFUSE_ADMIN_EMAIL
    adminPassword: REPLACE_ME_LANGFUSE_ADMIN_PASSWORD
    salt: REPLACE_ME_LANGFUSE_SALT
    encryptionKey: REPLACE_ME_64_HEX_LANGFUSE_ENCRYPTION_KEY
    nextauthSecret: REPLACE_ME_LANGFUSE_NEXTAUTH_SECRET
    postgresPassword: REPLACE_ME_LANGFUSE_POSTGRES_PASSWORD
    redisPassword: REPLACE_ME_LANGFUSE_REDIS_PASSWORD
    clickhousePassword: REPLACE_ME_LANGFUSE_CLICKHOUSE_PASSWORD
    minioRootPassword: REPLACE_ME_LANGFUSE_MINIO_ROOT_PASSWORD
